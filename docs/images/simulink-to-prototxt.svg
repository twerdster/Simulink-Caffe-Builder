<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Simulink-Caffe-Builder workflow (explanatory illustration)</title>
  <desc id="desc">Explanatory diagram, not a screenshot: Caffe layer blocks from CaffeLibrary.mdl are wired into a Simulink model; running the simulation writes one text fragment per layer, which a collation step appends into a single Caffe prototxt file.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h { font-size: 17px; font-weight: 700; }
    .t { font-size: 13px; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .note { font-size: 12px; fill: #6b7280; font-style: italic; }
    .flow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .blk { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; }
  </style>
  <rect width="960" height="320" fill="#ffffff"/>
  <text x="24" y="34" class="h" style="font-size:20px">Simulink as a visual builder for Caffe networks</text>
  <text x="936" y="34" class="note" text-anchor="end">Explanatory illustration, not a screenshot</text>

  <!-- Library + model -->
  <rect x="24" y="64" width="400" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="224" y="92" class="h" text-anchor="middle">1. Wire layer blocks in Simulink</text>
  <rect x="44" y="134" width="70" height="40" rx="4" class="blk"/><text x="79" y="159" class="m" text-anchor="middle">Data</text>
  <rect x="140" y="134" width="70" height="40" rx="4" class="blk"/><text x="175" y="159" class="m" text-anchor="middle">Conv</text>
  <rect x="236" y="110" width="70" height="40" rx="4" class="blk"/><text x="271" y="135" class="m" text-anchor="middle">ReLU</text>
  <rect x="236" y="160" width="70" height="40" rx="4" class="blk"/><text x="271" y="185" class="m" text-anchor="middle">Conv</text>
  <rect x="332" y="134" width="70" height="40" rx="4" class="blk"/><text x="367" y="159" class="m" text-anchor="middle">Loss</text>
  <path d="M114,154 L136,154" class="flow"/>
  <path d="M210,148 L232,132" class="flow"/>
  <path d="M210,160 L232,178" class="flow"/>
  <path d="M306,130 L328,148" class="flow"/>
  <path d="M306,180 L328,164" class="flow"/>
  <text x="224" y="226" class="m" text-anchor="middle">CaffeLibrary.mdl → your model</text>
  <text x="224" y="244" class="t" text-anchor="middle">(Example_3Stage.mdl is a sample)</text>

  <!-- simulate -->
  <rect x="470" y="64" width="200" height="190" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="570" y="92" class="h" text-anchor="middle">2. Simulate</text>
  <text x="570" y="116" class="t" text-anchor="middle">stop time 1, fixed-step,</text>
  <text x="570" y="134" class="t" text-anchor="middle">discrete solver</text>
  <g fill="#ffffff" stroke="#10b981">
    <rect x="520" y="152" width="70" height="20" rx="3"/><rect x="530" y="178" width="70" height="20" rx="3"/><rect x="540" y="204" width="70" height="20" rx="3"/>
  </g>
  <text x="570" y="244" class="t" text-anchor="middle">one .txt per layer</text>

  <!-- collate -->
  <rect x="716" y="64" width="220" height="190" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="826" y="92" class="h" text-anchor="middle">3. Collate</text>
  <text x="826" y="116" class="m" text-anchor="middle">collateFiles.m</text>
  <rect x="770" y="134" width="112" height="78" rx="4" fill="#ffffff" stroke="#b45309"/>
  <text x="782" y="156" class="m">layer {</text>
  <text x="794" y="174" class="m">…</text>
  <text x="782" y="192" class="m">}</text>
  <text x="826" y="236" class="m" text-anchor="middle">network .prototxt</text>

  <path d="M424,159 L466,159" class="flow"/>
  <path d="M670,159 L712,159" class="flow"/>

  <text x="24" y="286" class="note">Steps follow this README's instructions. collateFiles.m is described there but is not in the public</text>
  <text x="24" y="304" class="note">repository tree. The block names above are generic examples, not the library's exact contents.</text>
</svg>
